name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: basovoe-syrovarenie-exe
          path: dist/*.exe
          if-no-files-found: error
      # A push to main (or a manual run) publishes the .exe as a release:
      # releases/latest/download/Basovoe-syrovarenie.exe always points at the newest one.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Басовое космическое сыроварение ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body_path: ИНСТРУКЦИЯ.md
          files: dist/Basovoe-syrovarenie.exe
          make_latest: true
